0,"unit":"ml","name":"Sahne"},{"amount":0,"unit":"","name":"Salz, Pfeffer und Zucker"}],"steps":["Nudeln bissfest kochen. Zwiebel, Knoblauch und Chili klein schneiden; Kirschtomaten halbieren.","Zwiebel, Knoblauch und Chili anschwitzen. Passierte Tomaten, Sahne und Parmesan zu einer cremigen Soße verrühren und würzen.","Nudeln und frische Tomaten mit der Soße in einer Form mischen, Mozzarella darauf verteilen und überbacken. Mit Basilikum servieren."],"sourceStatus":"geprüft","unitLabel":"Portionen"},{"id":"anders-import-27","title":"Das beste Kartoffelgratin","description":"Kartoffeln in einer cremigen Ofensoße.","category":"Beilagen & Salate","time":90,"portions":4,"emoji":"🥔","color":"#f7e9f3","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/644981165672475/Das-beste-Kartoffelgratin.html","ingredients":[{"amount":0,"unit":"","name":"Butter für die Form"},{"amount":1,"unit":"Zehe","name":"Knoblauch"},{"amount":800,"unit":"g","name":"Kartoffeln"},{"amount":250,"unit":"ml","name":"Sahne"},{"amount":250,"unit":"ml","name":"Milch"},{"amount":1,"unit":"EL","name":"Gemüsebrühepulver"},{"amount":0,"unit":"","name":"Kräutersalz"},{"amount":0,"unit":"","name":"Pfeffer und Muskat"},{"amount":0,"unit":"","name":"Butterflöckchen"}],"steps":["Eine Auflaufform ausbuttern und mit Knoblauch ausreiben. Kartoffeln schälen und sehr dünn hobeln.","Kartoffeln schichten und mit Salz und Muskat würzen. Sahne, Milch und Brühepulver mischen und darübergießen.","Butterflöckchen darauf geben und bei 180 °C Ober-/Unterhitze rund eine Stunde backen."],"sourceStatus":"geprüft","unitLabel":"Portionen"},{"id":"anders-import-29","title":"Das kleine Schloßgeheimnis","description":"Schweinefilet mit Pilzen, Camembert und Soße.","category":"Hauptgerichte","time":60,"portions":4,"emoji":"🍖","color":"#e9e3f8","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/64391023778894/Das-kleine-Schlossgeheimnis.html","ingredients":[{"amount":1000,"unit":"g","name":"Schweinefilet"},{"amount":0,"unit":"","name":"Salz und Pfeffer"},{"amount":2,"unit":"EL","name":"Butter"},{"amount":2,"unit":"EL","name":"Mehl"},{"amount":125,"unit":"ml","name":"Brühe"},{"amount":125,"unit":"ml","name":"Milch"},{"amount":250,"unit":"ml","name":"Sahne"},{"amount":0,"unit":"","name":"Weißwein, Zitronensaft und Muskat"},{"amount":1,"unit":"EL","name":"Kerbel"},{"amount":2,"unit":"EL","name":"Petersilie"},{"amount":0,"unit":"","name":"Dill"},{"amount":500,"unit":"g","name":"Champignons"},{"amount":2,"unit":"Stück","name":"Camembert"}],"steps":["Schweinefilet in Scheiben anbraten, Champignons separat dünsten.","Butter und Mehl anschwitzen und mit Brühe, Milch und Sahne zu einer Soße verkochen. Mit Kräutern und Gewürzen abschmecken.","Fleisch, Pilze und Camembert in einer Form schichten, Soße darübergießen und im Backofen heiß werden lassen."],"sourceStatus":"geprüft","unitLabel":"Portionen"},{"id":"anders-import-11","title":"Der perfekte Pfannkuchen","description":"Ein Pfannkuchen-Grundrezept für viele Gelegenheiten.","category":"Frühstück","time":45,"portions":4,"emoji":"🥞","color":"#e9e3f8","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/1208161226570428/Der-perfekte-Pfannkuchen-gelingt-einfach-immer.html","ingredients":[{"amount":400,"unit":"g","name":"Mehl"},{"amount":3,"unit":"Stück","name":"große Eier"},{"amount":1,"unit":"Prise","name":"Salz"},{"amount":750,"unit":"ml","name":"Milch"},{"amount":30,"unit":"ml","name":"Sprudelwasser"},{"amount":0,"unit":"","name":"Butter zum Ausbacken"}],"steps":["Mehl, Eier, Milch und Salz zu einem klümpchenfreien Teig verrühren. Rund 30 Minuten ruhen lassen.","Mineralwasser kurz unterheben.","Etwas Butter in einer Pfanne erhitzen und den Teig nacheinander dünn ausbacken."],"sourceStatus":"geprüft","unitLabel":"Portionen"},{"id":"anders-import-30","title":"Die echte Sauce Bolognese","description":"Eine klassische, aromatische Bolognese.","category":"Hauptgerichte","time":150,"portions":6,"emoji":"🍝","color":"#fbe7e9","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/772011180069862/Die-echte-Sauce-Bolognese.html","ingredients":[{"amount":125,"unit":"g","name":"Butter (Soffritto)"},{"amount":2,"unit":"EL","name":"Olivenöl"},{"amount":2,"unit":"Stück","name":"große Zwiebeln (ca. 300–350 g)"},{"amount":3,"unit":"Stück","name":"Karotten (ca. 250–300 g)"},{"amount":3,"unit":"Stangen","name":"Staudensellerie"},{"amount":1000,"unit":"g","name":"Rinderhackfleisch"},{"amount":1,"unit":"Schuss","name":"Weißwein"},{"amount":500,"unit":"ml","name":"Milch (nach Bedarf 250–500 ml)"},{"amount":600,"unit":"ml","name":"geschälte Dosentomaten"},{"amount":3,"unit":"Zehen","name":"Knoblauch"},{"amount":3,"unit":"Stück","name":"Peperoncini"},{"amount":0,"unit":"","name":"Meersalz und schwarzer Pfeffer"},{"amount":600,"unit":"g","name":"Spaghetti"}],"steps":["Für das Soffritto Zwiebeln, Karotten und Staudensellerie sehr fein würfeln. In Butter und Olivenöl bei niedriger Hitze mindestens 30 Minuten weich dünsten, ohne stark zu bräunen.","Hackfleisch separat kräftig anbraten, mit Weißwein ablöschen und Milch zufügen.","Dosentomaten unterrühren, Soffritto, Knoblauchscheiben und zerdrückte Peperoncini einarbeiten. Mit Salz und Pfeffer abschmecken.","Mindestens 2 Stunden zugedeckt sanft köcheln lassen, für intensiveren Geschmack gern länger; bei Bedarf etwas Wasser nachgießen.","Spaghetti bissfest kochen und mit der Bolognesesauce servieren."],"sourceStatus":"geprüft","unitLabel":"Portionen","note":"Die Originalanleitung empfiehlt bis zu 5 Stunden Schmorzeit. Zeitangabe hier: mindestens 2 Stunden plus Vorbereitung."},{"id":"anders-import-16","title":"Engelsaugen","description":"Mürbe Plätzchen mit Marmeladenfüllung.","category":"Weihnachtsbäckerei","time":55,"portions":40,"emoji":"🍪","color":"#fff0d4","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/160601070188995/Engelsaugen.html","ingredients":[{"amount":240,"unit":"g","name":"Mehl"},{"amount":150,"unit":"g","name":"Butter"},{"amount":2,"unit":"Stück","name":"Eigelb"},{"amount":70,"unit":"g","name":"Puderzucker"},{"amount":2,"unit":"TL","name":"Vanillezucker"},{"amount":1,"unit":"Stück","name":"Bio-Zitrone (Abrieb)"},{"amount":1,"unit":"Prise","name":"Salz"},{"amount":0,"unit":"","name":"Himbeer- oder Johannisbeerkonfitüre"},{"amount":0,"unit":"","name":"Puderzucker zum Bestäuben"}],"steps":["Alle Teigzutaten verkneten und etwa 1–2 Stunden kalt stellen.","Kleine Kugeln rollen, in jede eine Mulde drücken und mit Konfitüre füllen.","Bei 180 °C Umluft etwa 10–15 Minuten backen und nach dem Abkühlen mit Puderzucker bestäuben."],"sourceStatus":"geprüft","unitLabel":"Stück","note":"Zusätzlich 1–2 Stunden Kühlzeit einplanen."},{"id":"anders-import-36","title":"Frühlingsragout mit Hähnchen","description":"Leichtes Hähnchenragout für den Frühling.","category":"Hauptgerichte","time":45,"portions":4,"emoji":"🍲","color":"#fbe7e9","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/261361101917442/Fruehlingsragout-mit-Haehnchen.html","ingredients":[{"amount":400,"unit":"g","name":"Kohlrabi"},{"amount":400,"unit":"g","name":"Karotten"},{"amount":250,"unit":"g","name":"Zuckerschoten"},{"amount":1,"unit":"Stück","name":"Zwiebel"},{"amount":500,"unit":"g","name":"Hähnchenfilet"},{"amount":3,"unit":"EL","name":"Öl"},{"amount":30,"unit":"g","name":"Mehl"},{"amount":400,"unit":"ml","name":"Geflügelfond"},{"amount":200,"unit":"ml","name":"Gemüsekochwasser"},{"amount":50,"unit":"ml","name":"Weißwein"},{"amount":50,"unit":"g","name":"Sahne"},{"amount":0.5,"unit":"Bund","name":"Schnittlauch"},{"amount":0,"unit":"","name":"Petersilie nach Bedarf"},{"amount":0,"unit":"","name":"Salz und schwarzer Pfeffer"}],"steps":["Kohlrabi und Karotten schälen und würfeln. Kohlrabi in Salzwasser vorkochen; nach rund 10 Minuten Karotten, kurz vor Ende Zuckerschoten hinzufügen. 200 ml Kochwasser auffangen.","Zwiebel und Hähnchen in Stücke schneiden und in Öl anbraten.","Mit Mehl bestäuben, kurz anschwitzen und Geflügelfond, Gemüsekochwasser, Weißwein und Sahne unter Rühren angießen. Aufkochen lassen.","Gegartes Gemüse zum Fleisch geben und alles erhitzen. Mit Salz und Pfeffer abschmecken, mit Schnittlauch und Petersilie bestreuen.","Nach Wunsch mit Brot servieren."],"sourceStatus":"geprüft","unitLabel":"Portionen"},{"id":"anders-import-03","title":"Geheimes Waffelrezept","description":"Lockere Waffeln für gemütliche Nachmittage.","category":"Frühstück","time":55,"portions":30,"emoji":"🧇","color":"#f7e9f3","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/662351168076093/Geheimes-Waffelrezept.html","ingredients":[{"amount":10,"unit":"Stück","name":"Eier"},{"amount":500,"unit":"g","name":"Zucker"},{"amount":500,"unit":"g","name":"Margarine"},{"amount":2,"unit":"Pck.","name":"Vanillinzucker"},{"amount":1,"unit":"Schuss","name":"Rum (optional)"},{"amount":1000,"unit":"g","name":"Mehl"},{"amount":1,"unit":"Pck.","name":"Backpulver"},{"amount":1000,"unit":"ml","name":"Milch"},{"amount":0,"unit":"","name":"Fett für das Waffeleisen"}],"steps":["Eier mit Zucker und Margarine schaumig rühren. Vanillezucker und nach Wunsch Rum zugeben.","Mehl und Backpulver einrühren; Milch nach und nach hinzufügen, bis ein glatter Waffelteig entsteht.","Portionsweise in einem vorgeheizten Waffeleisen goldbraun ausbacken."],"sourceStatus":"geprüft","unitLabel":"Waffeln","note":"Chefkoch gibt die gesamte Teigmenge als 1 Portion an; hier auf ca. 30 Waffeln umgestellt."},{"id":"anders-import-25","title":"Hähnchen süßsauer wie im Chinarestaurant","description":"Knuspriges Hähnchen mit süßsaurer Soße.","category":"Hauptgerichte","time":55,"portions":4,"emoji":"🍍","color":"#fae5dd","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/2826671434712499/Haehnchen-suesssauer-wie-im-Chinarestaurant.html","ingredients":[{"amount":250,"unit":"g","name":"Reis"},{"amount":2,"unit":"Stück","name":"Hähnchenbrustfilets"},{"amount":1,"unit":"Stück","name":"Ei"},{"amount":4,"unit":"EL","name":"Speisestärke (geteilt)"},{"amount":1,"unit":"Dose","name":"Ananasstücke (Saft auffangen)"},{"amount":7,"unit":"EL","name":"Apfel- oder Weißweinessig"},{"amount":4,"unit":"EL","name":"Zucker"},{"amount":1,"unit":"TL","name":"Salz"},{"amount":2,"unit":"EL","name":"Ketchup"},{"amount":2,"unit":"EL","name":"Sojasauce"},{"amount":2,"unit":"EL","name":"neutrales Öl"},{"amount":1,"unit":"Stück","name":"Zwiebel"},{"amount":2,"unit":"Stück","name":"Paprikaschoten"}],"steps":["Reis nach Packungsangabe kochen. Hähnchen in mundgerechte Stücke schneiden.","Ei verquirlen und leicht würzen. Hähnchenstücke erst in 2 EL Stärke wenden, dann durch das Ei ziehen und in einer beschichteten Pfanne vollständig gar braten. Herausnehmen.","Ananas abgießen und den Saft auffangen. Essig, Zucker, Salz, Sojasauce, Ketchup und Öl zu einer Sauce verrühren.","Zwiebel und Paprika in der Pfanne anbraten. Ananasstücke zugeben und kurz mitbraten; die Sauce angießen und einige Minuten köcheln.","Restliche 2 EL Stärke mit ungefähr 60–80 ml Ananassaft glatt rühren und damit die Sauce andicken. Hähnchen wieder zufügen und vollständig erhitzen.","Mit dem Reis servieren."],"sourceStatus":"geprüft","unitLabel":"Portionen","note":"Die 4 EL Speisestärke werden auf Panade (2 EL) und Sauce (2 EL) aufgeteilt."},{"id":"anders-import-26","title":"Käse-Lauch-Suppe mit Hackfleisch","description":"Wärmende, cremige Suppe mit Lauch und Hackfleisch.","category":"Snacks & Suppen","time":35,"portions":4,"emoji":"🥣","color":"#e4f3e9","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/982031203667502/Kaese-Lauch-Suppe-mit-Hackfleisch.html","ingredients":[{"amount":2,"unit":"Stück","name":"kleine Aufbackbaguettes"},{"amount":3,"unit":"EL","name":"Öl"},{"amount":500,"unit":"g","name":"gemischtes Hackfleisch"},{"amount":3,"unit":"Stangen","name":"Lauch"},{"amount":700,"unit":"ml","name":"Wasser"},{"amount":3,"unit":"Stück","name":"Gemüsebrühwürfel"},{"amount":250,"unit":"g","name":"Schmelzkäse"},{"amount":150,"unit":"g","name":"Crème fraîche"},{"amount":0,"unit":"","name":"Salz, Pfeffer, Muskat, Knoblauch- und Zwiebelpulver"}],"steps":["Hackfleisch in einem Topf mit Öl krümelig braten, dann Lauchringe hinzugeben.","Mit Wasser und Brühe aufgießen, etwa 10 Minuten köcheln lassen.","Schmelzkäse und Crème fraîche einrühren und abschmecken. Dazu aufgebackenes Baguette reichen."],"sourceStatus":"geprüft","unitLabel":"Portionen"},{"id":"anders-import-10","title":"KFC Coleslaw","description":"Cremiger Krautsalat zu Grillgerichten.","category":"Beilagen & Salate","time":30,"portions":10,"emoji":"🥗","color":"#fff0d4","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/3017351454519857/KFC-Coleslaw.html","ingredients":[{"amount":800,"unit":"g","name":"Weißkohl"},{"amount":1,"unit":"Stück","name":"mittelgroße Karotte"},{"amount":1,"unit":"Stück","name":"kleine Zwiebel"},{"amount":65,"unit":"g","name":"Zucker"},{"amount":0.5,"unit":"TL","name":"Salz"},{"amount":1,"unit":"Prise","name":"Pfeffer"},{"amount":60,"unit":"ml","name":"Milch"},{"amount":125,"unit":"g","name":"Mayonnaise"},{"amount":60,"unit":"ml","name":"Buttermilch"},{"amount":1.5,"unit":"EL","name":"Weißweinessig"},{"amount":2.5,"unit":"EL","name":"Zitronensaft"},{"amount":0.25,"unit":"TL","name":"Paprikapulver"},{"amount":0.5,"unit":"TL","name":"Senf (optional)"}],"steps":["Kohl, Karotte und Zwiebel sehr fein schneiden oder raspeln.","Dressing aus den übrigen Zutaten verrühren und unter das Gemüse heben.","Abgedeckt möglichst über Nacht im Kühlschrank durchziehen lassen."],"sourceStatus":"geprüft","unitLabel":"Portionen","note":"Zusätzlich etwa 8–15 Stunden Kühlzeit einplanen."},{"id":"anders-import-28","title":"Königsberger Klopse","description":"Ein Klassiker mit heller Kapernsoße.","category":"Hauptgerichte","time":65,"portions":4,"emoji":"🍽️","color":"#fff0d4","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/547961152362440/Koenigsberger-Klopse.html","ingredients":[{"amount":1,"unit":"Stück","name":"Brötchen vom Vortag"},{"amount":1,"unit":"Stück","name":"Zwiebel (Klopse)"},{"amount":2,"unit":"Stück","name":"Sardellenfilets"},{"amount":1,"unit":"Bund","name":"Petersilie"},{"amount":1,"unit":"Stück","name":"Ei"},{"amount":400,"unit":"g","name":"Rindertatar"},{"amount":0,"unit":"","name":"Salz und Pfeffer"},{"amount":1,"unit":"Stück","name":"Zwiebel (Brühe)"},{"amount":2,"unit":"Stück","name":"Gewürznelken"},{"amount":1,"unit":"Stück","name":"Lorbeerblatt"},{"amount":500,"unit":"ml","name":"Fleischbrühe"},{"amount":30,"unit":"g","name":"Halbfettbutter"},{"amount":50,"unit":"g","name":"Mehl"},{"amount":150,"unit":"ml","name":"fettarme Milch"},{"amount":3,"unit":"EL","name":"Kapern"},{"amount":1,"unit":"Bund","name":"Schnittlauch"},{"amount":0,"unit":"","name":"Zitronensaft für die Sauce"}],"steps":["Brötchen kurz einweichen und sorgfältig ausdrücken. Eine Zwiebel, Sardellen und Petersilie fein hacken und mit Ei und Tatar verkneten. Würzen und ungefähr 16 Klopse formen.","Zweite Zwiebel mit Nelken und Lorbeer versehen und in der Fleischbrühe aufkochen. Hitze reduzieren, Klopse einlegen und 15–20 Minuten nur ziehen lassen. Herausheben und warmhalten.","Butter schmelzen und Mehl anschwitzen. Etwa 400 ml der Kochbrühe und die Milch nach und nach unterrühren und aufkochen lassen.","Kapern dazugeben, Sauce mit Zitronensaft, Salz und Pfeffer würzen. Klopse darin erhitzen und mit Schnittlauch anrichten."],"sourceStatus":"geprüft","unitLabel":"Portionen","note":"Ergibt etwa 16 Klopse für 4 Portionen. Kartoffeln passen gut dazu."},{"id":"anders-import-09","title":"Kürbis-Risotto","description":"Cremiges Risotto mit Kürbis.","category":"Vegetarisch","time":45,"portions":4,"emoji":"🎃","color":"#f7e9f3","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/351681120497520/Kuerbis-Risotto.html","ingredients":[{"amount":450,"unit":"g","name":"Kürbisfleisch"},{"amount":1,"unit":"Stück","name":"Schalotte"},{"amount":1,"unit":"Zehe","name":"Knoblauch"},{"amount":2,"unit":"EL","name":"Olivenöl"},{"amount":2,"unit":"EL","name":"Butter"},{"amount":350,"unit":"g","name":"Risottoreis"},{"amount":100,"unit":"ml","name":"Weißwein"},{"amount":1000,"unit":"ml","name":"heiße Gemüsebrühe"},{"amount":1,"unit":"Bund","name":"Frühlingszwiebeln"},{"amount":3,"unit":"EL","name":"Crème fraîche"},{"amount":50,"unit":"g","name":"Parmesan"},{"amount":0,"unit":"","name":"Pfeffer"},{"amount":0.5,"unit":"Kästchen","name":"Kresse"}],"steps":["Kürbis in kleine Stücke schneiden, Schalotte und Knoblauch fein hacken.","Gemüse in Öl und Butter anschwitzen. Reis einrühren, mit Wein ablöschen und die heiße Brühe nach und nach zugeben.","Etwa 20 Minuten unter gelegentlichem Rühren garen. Frühlingszwiebeln, Crème fraîche und Parmesan einarbeiten; abschmecken und mit Kresse servieren."],"sourceStatus":"geprüft","unitLabel":"Portionen"},{"id":"anders-import-21","title":"Lakritz-Likör „7 auf 100“","description":"Ein selbstgemachter Likör mit Lakritz.","category":"Getränke","time":15,"portions":1,"emoji":"🥃","color":"#f7e9f3","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/1270371232289276/Lakritz-Likoer-7-auf-100.html","ingredients":[{"amount":35,"unit":"Stück","name":"Türkisch-Pfeffer-Salmiakbonbons"},{"amount":500,"unit":"ml","name":"Wodka (ca. 38 % vol.)"}],"steps":["Eine geeignete Flasche mit etwa 500 ml Wodka bereitstellen; bei einer 700-ml-Flasche zuvor ungefähr 200 ml abfüllen.","35 Bonbons gegebenenfalls zerkleinern und in den Wodka geben.","Flasche gut verschließen und kalt stellen. Im Verlauf des nächsten Tages immer wieder schütteln, bis sich die Bonbons vollständig aufgelöst haben.","Gut gekühlt lagern. Nur für Erwachsene."],"sourceStatus":"geprüft","unitLabel":"Ansätze (je 500 ml)","note":"Ein Ansatz ergibt rund 500 ml Likör. Zubereitungszeit ca. 15 Minuten, danach ungefähr einen Tag zum Auflösen einplanen. Enthält Alkohol."},{"id":"anders-import-18","title":"Lothars beste Nürnberger Elisenlebkuchen","description":"Würzige Elisenlebkuchen zur Weihnachtszeit.","category":"Weihnachtsbäckerei","time":65,"portions":40,"emoji":"🍯","color":"#fbe7e9","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/1010591206190843/Lothars-beste-Nuernberger-Elisenlebkuchen.html","ingredients":[{"amount":6,"unit":"Stück","name":"Eier (M)"},{"amount":180,"unit":"g","name":"brauner Zucker"},{"amount":2,"unit":"EL","name":"flüssiger Honig"},{"amount":2,"unit":"TL","name":"Zimt"},{"amount":1,"unit":"TL","name":"Lebkuchengewürz"},{"amount":1,"unit":"Prise","name":"Salz"},{"amount":250,"unit":"g","name":"gemahlene Mandeln"},{"amount":250,"unit":"g","name":"gemahlene Haselnüsse"},{"amount":200,"unit":"g","name":"Orangeat, fein gehackt"},{"amount":200,"unit":"g","name":"Zitronat, fein gehackt"},{"amount":40,"unit":"Stück","name":"Backoblaten (70 mm)"},{"amount":200,"unit":"g","name":"Kuvertüre (optional)"}],"steps":["Eier, braunen Zucker und Honig ungefähr 5 Minuten schaumig aufschlagen.","Zimt, Lebkuchengewürz, Salz, Nüsse und fein zerkleinertes Orangeat/Zitronat einrühren.","Die Masse auf Backoblaten verteilen und leicht in Form streichen.","Bei 150 °C Ober-/Unterhitze im vorgeheizten Ofen circa 20 Minuten backen.","Nach dem vollständigen Auskühlen auf Wunsch mit geschmolzener Kuvertüre überziehen."],"sourceStatus":"geprüft","unitLabel":"Lebkuchen","note":"Mit 70-mm-Oblaten etwa 40 Stück; mit 90-mm-Oblaten etwa 30 Stück. Für die Umrechnung ist die 70-mm-Variante eingestellt."},{"id":"anders-import-20","title":"Nudelauflauf mit Brokkoli und Schinken","description":"Herzhafter Auflauf mit Brokkoli.","category":"Hauptgerichte","time":50,"portions":3,"emoji":"🥦","color":"#e4f3e9","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/472031140743499/Nudelauflauf-mit-Brokkoli-und-Schinken.html","ingredients":[{"amount":300,"unit":"g","name":"Nudeln"},{"amount":300,"unit":"g","name":"Brokkoli"},{"amount":150,"unit":"g","name":"Kochschinken"},{"amount":1,"unit":"Becher","name":"Schmand"},{"amount":1,"unit":"Becher","name":"Sahne"},{"amount":100,"unit":"ml","name":"Milch"},{"amount":100,"unit":"g","name":"geriebener Käse"},{"amount":0,"unit":"","name":"Salz und Pfeffer"},{"amount":0,"unit":"","name":"Muskat (optional)"}],"steps":["Nudeln in Salzwasser bissfest kochen.","Brokkoli in kleine Röschen teilen und ebenfalls nur bissfest garen. Schinken würfeln, alles in eine Auflaufform geben.","Schmand, Sahne und Milch miteinander verrühren und mit Salz, Pfeffer und gegebenenfalls Muskat würzen. Über die Nudelmischung geben und Käse darüberstreuen.","Bei 180 °C Ober-/Unterhitze ungefähr 20 Minuten goldbraun überbacken."],"sourceStatus":"geprüft","unitLabel":"Portionen"},{"id":"anders-import-05","title":"Omas Zimtsterne","description":"Der Klassiker zur Adventszeit.","category":"Weihnachtsbäckerei","time":42,"portions":1,"emoji":"⭐","color":"#e9e3f8","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/570771155723405/Omas-Zimtsterne.html","ingredients":[{"amount":190,"unit":"g","name":"Puderzucker"},{"amount":100,"unit":"g","name":"gemahlene Mandeln"},{"amount":200,"unit":"g","name":"gemahlene Haselnüsse"},{"amount":2,"unit":"Stück","name":"Eiweiß"},{"amount":1,"unit":"TL","name":"Zimt"},{"amount":1,"unit":"Spritzer","name":"Zitronensaft"}],"steps":["Eiweiß mit Puderzucker zu festem, glänzendem Eischnee schlagen. Etwa ein Drittel als Glasur beiseitestellen.","Die übrige Eiweißmasse mit Zimt, Zitronensaft und etwa 100 g der gemahlenen Nüsse verkneten.","Auf den verbleibenden Nüssen ungefähr 8–10 mm dick ausrollen, Sterne ausstechen und auf Backpapier legen.","Mit der aufbewahrten Eiweißglasur bestreichen. Bei 150 °C Ober-/Unterhitze circa 10–12 Minuten backen; während der letzten Minuten bei Bedarf Ofentür kurz einen Spalt öffnen."],"sourceStatus":"geprüft","unitLabel":"Teigansätze","note":"Chefkoch nennt 1 Rezeptansatz, aber keine feste Stückzahl. Deshalb erfolgt die Mengenberechnung hier pro Teigansatz."},{"id":"anders-import-22","title":"Paprika-Sahne-Hähnchen","description":"Hähnchen aus dem Ofen mit cremiger Paprikasoße.","category":"Hauptgerichte","time":60,"portions":4,"emoji":"🍗","color":"#fff0d4","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/22771005725755/Paprika-Sahne-Haehnchen.html","ingredients":[{"amount":4,"unit":"Stück","name":"Hähnchenbrustfilets"},{"amount":2,"unit":"Stück","name":"rote Paprika"},{"amount":1,"unit":"Stück","name":"grüne Paprika"},{"amount":1,"unit":"Stück","name":"Zwiebel"},{"amount":2,"unit":"Zehen","name":"Knoblauch"},{"amount":1,"unit":"Stück","name":"getrocknete Chilischote"},{"amount":1,"unit":"Becher","name":"Sahne"},{"amount":1,"unit":"Becher","name":"Schmand"},{"amount":1,"unit":"TL","name":"Tomatenmark"},{"amount":125,"unit":"ml","name":"Gemüsebrühe"},{"amount":1,"unit":"EL","name":"Paprikapulver edelsüß"},{"amount":1,"unit":"TL","name":"Paprikapulver rosenscharf"},{"amount":100,"unit":"g","name":"geriebener Käse"},{"amount":0,"unit":"","name":"Öl und Salz"}],"steps":["Hähnchenfilets würzen und in eine Auflaufform setzen. Paprika in Streifen schneiden und darauf verteilen.","Zwiebel, Knoblauch und Chili anschwitzen. Sahne, Schmand, Tomatenmark und Brühe zu einer würzigen Soße verarbeiten.","Die Soße über das Hähnchen geben, Käse darüberstreuen und im Ofen etwa 40 Minuten garen."],"sourceStatus":"geprüft","unitLabel":"Portionen"},{"id":"anders-import-07","title":"Penne mit Zucchini, Pinienkernen und Parmesan","description":"Sommerliche Pasta mit gerösteten Pinienkernen.","category":"Vegetarisch","time":15,"portions":2,"emoji":"🍝","color":"#fae5dd","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/1227841227947517/Penne-mit-Zucchini-Pinienkernen-und-Parmesan.html","ingredients":[{"amount":250,"unit":"g","name":"Penne"},{"amount":3,"unit":"EL","name":"Pinienkerne"},{"amount":400,"unit":"g","name":"Zucchini"},{"amount":1,"unit":"Stück","name":"kleine Z  Zutaten zubereiten, Obst darauf verteilen und mit Streuseln bedecken.","In einer gefetteten Form ungefähr eine Stunde backen."],"sourceStatus":"geprüft","unitLabel":"Stück"},{"id":"anders-import-33","title":"Schlemmertopf mit Hackfleisch","description":"Herzhaftes Gericht aus dem Ofen.","category":"Hauptgerichte","time":70,"portions":6,"emoji":"🥘","color":"#f7e9f3","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/884541194027076/Schlemmertopf-mit-Hackfleisch.html","ingredients":[{"amount":500,"unit":"g","name":"Hackfleisch"},{"amount":2,"unit":"Stück","name":"Zwiebeln"},{"amount":2,"unit":"Zehen","name":"Knoblauch"},{"amount":2,"unit":"Stück","name":"rote Paprikaschoten"},{"amount":300,"unit":"g","name":"grüne Bohnen (frisch oder TK)"},{"amount":800,"unit":"g","name":"Kartoffeln, geschält"},{"amount":250,"unit":"g","name":"Karotten, geschält"},{"amount":0.5,"unit":"Dose","name":"Mais"},{"amount":0.5,"unit":"Tube","name":"Tomatenmark (nach Geschmack)"},{"amount":1000,"unit":"ml","name":"Gemüsebrühe"},{"amount":2,"unit":"EL","name":"Olivenöl"},{"amount":200,"unit":"g","name":"Sahneschmelzkäse"},{"amount":200,"unit":"g","name":"Sahne"},{"amount":0,"unit":"","name":"Salz, Pfeffer, Paprika und Thymian"},{"amount":0,"unit":"","name":"Crème fraîche (Garnitur)"},{"amount":0,"unit":"","name":"Petersilie (Garnitur)"}],"steps":["Zwiebel, Knoblauch, Paprika, Karotten und Kartoffeln klein schneiden.","Hackfleisch in Olivenöl krümelig anbraten, Zwiebel und Knoblauch zugeben. Tomatenmark und Gewürze unterrühren, Gemüsebrühe angießen.","Kartoffeln, Karotten, Paprika, Bohnen, Mais und Thymian zugeben. Alles zugedeckt ungefähr 40 Minuten sanft köcheln lassen; Bohnen vollständig garen.","Sahneschmelzkäse und Sahne einrühren, erneut abschmecken und nach Wunsch mit Crème fraîche und Petersilie servieren."],"sourceStatus":"geprüft","unitLabel":"Portionen","note":"Auf der Originalseite ist die Gesamtzeit mit 30 Minuten angegeben; der Text nennt zusätzlich ca. 40 Minuten Köcheln. Hier realistisch 70 Minuten eingeplant."},{"id":"anders-import-19","title":"Schneller Flammkuchen","description":"Knuspriger Flammkuchen mit dünnem Teig.","category":"Hauptgerichte","time":35,"portions":2,"emoji":"🍕","color":"#fae5dd","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/1107291216818673/Schneller-Flammkuchen.html","ingredients":[{"amount":2,"unit":"EL","name":"Öl (Teig)"},{"amount":125,"unit":"ml","name":"Wasser (Teig)"},{"amount":1,"unit":"Prise","name":"Salz (Teig)"},{"amount":250,"unit":"g","name":"Mehl (Teig)"},{"amount":2,"unit":"Stück","name":"Zwiebeln"},{"amount":1,"unit":"Becher","name":"Schmand"},{"amount":1,"unit":"Becher","name":"Crème double"},{"amount":100,"unit":"g","name":"Speckwürfel"},{"amount":0,"unit":"","name":"Salz und Pfeffer (Belag)"},{"amount":0,"unit":"","name":"Schnittlauchröllchen"}],"steps":["Öl, Wasser, Salz und Mehl zu einem glatten Teig verkneten und sehr dünn ausrollen.","Schmand und Crème double verrühren, würzen und auf dem ausgerollten Teig verstreichen.","Zwiebeln in feine Halbringe schneiden, bei Bedarf mit wenig Wasser etwa eine Minute in der Mikrowelle vorgaren und mit Speck auf dem Teig verteilen.","Auf unterer Schiene bei 250 °C Ober-/Unterhitze ungefähr 20 Minuten backen. Mit Schnittlauch bestreut servieren."],"sourceStatus":"geprüft","unitLabel":"Portionen","note":"Die Quelle zeigt 1 Rezeptansatz; die Autorin sagt ausdrücklich, dass er für etwa 2 Personen reicht. Hier deshalb auf 2 Portionen eingestellt."},{"id":"anders-import-24","title":"Schupfnudel-Wirsing-Gratin mit Kasseler","description":"Deftiges Wintergratin mit Schupfnudeln.","category":"Hauptgerichte","time":65,"portions":4,"emoji":"🥬","color":"#fbe7e9","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/2059481333174116/Schupfnudel-Wirsing-Gratin-mit-Kasseler.html","ingredients":[{"amount":500,"unit":"g","name":"Wirsing, geputzt (ca. 1 kleiner Kopf)"},{"amount":150,"unit":"g","name":"Zwiebeln"},{"amount":200,"unit":"g","name":"Kasseler, ohne Knochen"},{"amount":125,"unit":"ml","name":"Gemüsebrühe"},{"amount":400,"unit":"g","name":"Schupfnudeln (Kühlregal)"},{"amount":125,"unit":"g","name":"saure Sahne"},{"amount":1,"unit":"TL","name":"mittelscharfer Senf"},{"amount":50,"unit":"g","name":"geriebener Käse"},{"amount":1,"unit":"EL","name":"Schnittlauchröllchen"},{"amount":0,"unit":"","name":"Salz, Pfeffer und gemahlener Kümmel"},{"amount":0,"unit":"","name":"etwas Öl zum Anschwitzen"}],"steps":["Wirsing vom Strunk befreien und in feine Streifen schneiden. Zwiebeln ebenfalls in Streifen schneiden.","Zwiebeln mit etwas Öl anschwitzen, Wirsing zugeben und kurz dünsten. Brühe angießen und 10–15 Minuten bissfest schmoren.","Kasseler würfeln und zusammen mit Schupfnudeln unter den Wirsing mischen. Saure Sahne und Senf einrühren und mit Salz, Pfeffer und Kümmel abschmecken.","Alles in eine Auflaufform geben, mit geriebenem Käse und Schnittlauch bestreuen.","Bei 200 °C Ober-/Unterhitze etwa 25 Minuten überbacken."],"sourceStatus":"geprüft","unitLabel":"Portionen"},{"id":"anders-import-32","title":"Schwedische Kartoffeln","description":"Eingeschnittene Ofenkartoffeln in cremiger Soße.","category":"Beilagen & Salate","time":80,"portions":4,"emoji":"🥔","color":"#e4f3e9","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/1386571243753438/Schwedische-Kartoffeln.html","ingredients":[{"amount":200,"unit":"g","name":"Sauerrahm"},{"amount":200,"unit":"g","name":"Crème fraîche"},{"amount":400,"unit":"ml","name":"Fleischbrühe"},{"amount":1000,"unit":"g","name":"kleine Drillinge"},{"amount":50,"unit":"g","name":"Butter"},{"amount":75,"unit":"g","name":"Katenschinken"},{"amount":1,"unit":"TL","name":"Rosmarin"},{"amount":5,"unit":"Scheiben","name":"Toastbrot"}],"steps":["Sauerrahm, Crème fraîche und Brühe in einer Auflaufform verrühren.","Kartoffeln mehrmals quer einschneiden, aber nicht durchtrennen, und in die Soße setzen.","Bei 200 °C Ober-/Unterhitze 45–60 Minuten garen. Butter, Schinken, Rosmarin und Toastwürfel darüberstreuen und knusprig fertigbacken."],"sourceStatus":"geprüft","unitLabel":"Portionen"},{"id":"anders-import-08","title":"Schweinefilet auf Süßkartoffelpüree mit Lebkuchenjus und Rosenkohl","description":"Ein besonderes Essen für festliche Tage.","category":"Hauptgerichte","time":90,"portions":4,"emoji":"🍖","color":"#e4f3e9","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/1417941246631682/Schweinefilet-auf-Suesskartoffelpueree-mit-Lebkuchenjus-und-Rosenkohl.html","ingredients":[{"amount":8,"unit":"Stück","name":"Schweinemedaillons à ca. 80 g"},{"amount":2,"unit":"EL","name":"Öl"},{"amount":1,"unit":"EL","name":"Honig"},{"amount":200,"unit":"ml","name":"Rotwein"},{"amount":100,"unit":"ml","name":"Bratenfond"},{"amount":1,"unit":"Stück","name":"Soßenlebkuchen oder Kräuterprinte"},{"amount":400,"unit":"g","name":"Süßkartoffeln"},{"amount":50,"unit":"ml","name":"Sahne"},{"amount":50,"unit":"ml","name":"Milch"},{"amount":400,"unit":"g","name":"Rosenkohl"},{"amount":1,"unit":"EL","name":"Butter"},{"amount":2,"unit":"EL","name":"Semmelbrösel"},{"amount":0,"unit":"","name":"Salz, Pfeffer und Muskat"}],"steps":["Süßkartoffeln würfeln, in Salzwasser weich kochen und abdampfen lassen. Mit erwärmter Milch und Sahne zerstampfen, mit Salz, Pfeffer und Muskat abschmecken.","Medaillons in heißem Öl von beiden Seiten anbraten und bei 160 °C Umluft ungefähr 12 Minuten im Ofen fertig garen.","Bratensatz mit Rotwein ablöschen, Honig ergänzen und reduzieren. Fond und fein gemahlenen Lebkuchen einrühren; die Sauce sämig einkochen.","Rosenkohl blanchieren und in Butter mit Muskat und Salz schwenken. Semmelbrösel zufügen und goldig anrösten.","Püree, Medaillons und Rosenkohl anrichten; die Lebkuchensauce über das Fleisch geben."],"sourceStatus":"geprüft","unitLabel":"Portionen"},{"id":"anders-import-12","title":"Surinas seidene Kartoffelklöße","description":"Weiche Klöße aus gekochten Kartoffeln.","category":"Beilagen & Salate","time":60,"portions":16,"emoji":"🥔","color":"#fbe7e9","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/473601141052125/Surina-s-seidene-Kartoffelkloesse-aus-gekochten-Kartoffeln.html","ingredients":[{"amount":600,"unit":"g","name":"mehligkochende Kartoffeln"},{"amount":2,"unit":"Stück","name":"Eigelb"},{"amount":50,"unit":"g","name":"Kartoffelmehl / Kartoffelstärke"},{"amount":30,"unit":"g","name":"geschmolzene Butter"},{"amount":0,"unit":"","name":"Salz"},{"amount":0,"unit":"","name":"Muskat, frisch gerieben"}],"steps":["Kartoffeln mit Schale kochen, pellen und einige Minuten bei 150 °C im Backofen trocknen.","Die noch warmen Kartoffeln zweimal durch die Kartoffelpresse drücken, bis eine besonders feine Masse entstanden ist.","Eigelb, Stärke und lauwarm geschmolzene Butter nacheinander sorgfältig unterkneten. Mit Salz und Muskat würzen.","Masse zu zwei Rollen von etwa 4 cm Dicke formen, jede Rolle in acht Stücke teilen und mit leicht bemehlten Händen zu Klößen rollen.","Salzwasser aufkochen und danach nur noch sieden lassen. Klöße vorsichtig einlegen und ungefähr 15 Minuten gar ziehen lassen; abtropfen."],"sourceStatus":"geprüft","unitLabel":"Klöße","note":"Ergibt 16 kleinere Klöße. Wichtig: mehligkochende Kartoffeln verwenden und nicht sprudelnd kochen."},{"id":"anders-import-14","title":"Toffifee-Kekse","description":"Kekse mit Toffifee.","category":"Weihnachtsbäckerei","time":140,"portions":48,"emoji":"🍪","color":"#e4f3e9","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/580921157018016/Toffifee-Kekse.html","ingredients":[{"amount":150,"unit":"g","name":"Mehl (Mürbeteig)"},{"amount":100,"unit":"g","name":"Butter (Mürbeteig)"},{"amount":50,"unit":"g","name":"Zucker (Mürbeteig)"},{"amount":1,"unit":"Stück","name":"Eigelb (Mürbeteig)"},{"amount":1,"unit":"Prise","name":"Salz (Mürbeteig)"},{"amount":1,"unit":"EL","name":"kaltes Wasser (Mürbeteig)"},{"amount":3,"unit":"Stück","name":"Eiweiß (Baiser)"},{"amount":50,"unit":"g","name":"Zucker (Baiser)"},{"amount":1,"unit":"EL","name":"Speisestärke (Baiser)"},{"amount":1,"unit":"TL","name":"Zitronensaft (Baiser)"},{"amount":1,"unit":"Prise","name":"Salz (Baiser)"},{"amount":48,"unit":"Stück","name":"Toffifee"}],"steps":["Mürbeteigzutaten mit einem Esslöffel kaltem Wasser verkneten und eine Stunde kühlen.","Teig dünn ausrollen, 48 etwas größere Kreise als die Toffifee ausstechen und je eine Praline mit der runden Seite nach oben daraufsetzen.","Eiweiß und Salz steif schlagen. Zucker größtenteils einrieseln lassen, den Rest mit Stärke vermengen und unterrühren; Zitronensaft zufügen.","Baisermasse um die Pralinen spritzen und oben spitz formen.","Bei 150 °C etwa 20 Minuten backen und im ausgeschalteten, geschlossenen Ofen abkühlen lassen."],"sourceStatus":"geprüft","unitLabel":"Kekse","note":"Wenn möglich über Nacht trocknen lassen. Die Kühlzeit von ca. 1 Stunde ist zusätzlich zur Arbeits-/Backzeit eingeplant."},{"id":"anders-import-35","title":"Tomate-Mozzarella-Baguette","description":"Überbackenes Baguette mit Basilikum.","category":"Snacks & Suppen","time":30,"portions":1,"emoji":"🥖","color":"#e9e3f8","image":"","favorite":false,"source":"https://www.einfachkochen.de/rezepte/tomate-mozzarella-baguette-das-beste-blitzrezept","ingredients":[{"amount":1,"unit":"Stück","name":"Baguette"},{"amount":1,"unit":"Zehe","name":"Knoblauch"},{"amount":4,"unit":"EL","name":"Olivenöl"},{"amount":4,"unit":"Stück","name":"Tomaten"},{"amount":2,"unit":"Kugeln","name":"Mozzarella"},{"amount":1,"unit":"Bund","name":"Basilikum"},{"amount":0,"unit":"","name":"Salz und Pfeffer"}],"steps":["Baguette halbieren und die Schnittseiten mit Knoblauch und Olivenöl bestreichen.","Tomaten und Mozzarella in Scheiben schneiden und auf den Baguettehälften verteilen.","Bei 175 °C Umluft etwa 10 Minuten überbacken, dann mit Basilikum, Salz und Pfeffer würzen."],"sourceStatus":"geprüft","unitLabel":"Portionen"},{"id":"anders-family-cookies-subway-2026","title":"Unsere Subway-Style Cookies","description":"Außen leicht knusprig, innen weich und chewy – unsere Familien-Cookies mit extra viel Schokolade. Ergibt ca. 80 große Cookies à 40–45 g Teig.","category":"Backen & Süßes","time":155,"portions":80,"emoji":"🍪","color":"#f7dfe3","image":"","favorite":true,"source":"","ingredients":[{"amount":500,"unit":"g","name":"Butter"},{"amount":875,"unit":"g","name":"brauner Zucker"},{"amount":5,"unit":"Stück","name":"Eier (Größe L)"},{"amount":2,"unit":"TL","name":"Vanilleextrakt"},{"amount":1110,"unit":"g","name":"Mehl"},{"amount":40,"unit":"g","name":"Speisestärke"},{"amount":2.5,"unit":"TL","name":"Backpulver"},{"amount":2,"unit":"TL","name":"Salz"},{"amount":550,"unit":"g","name":"Schokolade (gehackt oder Drops)"}],"steps":["Butter und braunen Zucker cremig aufschlagen. Eier nach und nach sowie den Vanilleextrakt einrühren.","Mehl, Speisestärke, Backpulver und Salz vermischen. Nur kurz unter die Buttermasse rühren, damit die Cookies später weich bleiben.","Die Schokolade unterheben und den Teig mindestens 2 Stunden im Kühlschrank kühlen.","Aus dem gekühlten Teig lockere Kugeln zu je 40–45 g formen. Nicht flach drücken! Mit 6–8 cm Abstand auf Backpapier setzen. Nach dem Formen bei Bedarf weitere 20–30 Minuten kühlen.","Bei 180 °C Ober-/Unterhitze etwa 10–13 Minuten backen. Die Ränder sollen leicht goldbraun und die Mitte noch weich sein; beim Abkühlen werden die Cookies fester.","Etwa 10 Minuten auf dem Blech ruhen lassen. Danach mitsamt Backpapier vom Blech ziehen und vollständig abkühlen lassen."],"sourceStatus":"geprüft","unitLabel":"Cookies","note":"Bei etwa 35 g Teig pro Kugel werden es ungefähr 95 Cookies. Dann die Backzeit früher kontrollieren. Für dicke, weiche Cookies die Kugeln vor dem Backen nicht flach drücken."},{"id":"anders-import-17","title":"Uromas Vanillekipferl","description":"Zarte Vanillekipferl mit Mandeln.","category":"Weihnachtsbäckerei","time":60,"portions":90,"emoji":"🥐","color":"#e9e3f8","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/403911129675192/Uromas-Vanillekipferl.html","ingredients":[{"amount":250,"unit":"g","name":"Mehl"},{"amount":210,"unit":"g","name":"weiche Butter"},{"amount":100,"unit":"g","name":"gemahlene Mandeln"},{"amount":80,"unit":"g","name":"Zucker oder Puderzucker"},{"amount":2,"unit":"Pck.","name":"Vanillezucker für den Teig"},{"amount":1,"unit":"Prise","name":"Salz"},{"amount":1,"unit":"Pck.","name":"Puderzucker zum Wälzen"},{"amount":2,"unit":"Pck.","name":"Vanillezucker zum Wälzen"}],"steps":["Zutaten für den Teig verkneten, Rollen formen und mindestens 30 Minuten kalt stellen.","Aus Teigstückchen kleine Hörnchen formen und auf ein Blech mit Backpapier setzen.","Bei 175 °C Umluft ungefähr 10–15 Minuten backen und noch warm vorsichtig in Vanille-Puderzucker wenden."],"sourceStatus":"geprüft","unitLabel":"Stück","note":"Menge ergibt laut Quelle etwa 80–100 Stück, hier mit 90 Stück gerechnet."},{"id":"anders-import-06","title":"Vanille Cake Pops","description":"Kleine Kuchen am Stiel mit Vanille.","category":"Backen & Süßes","time":230,"portions":40,"emoji":"🍭","color":"#fbe7e9","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/1996921323358725/Vanille-Cake-Pops.html","ingredients":[{"amount":250,"unit":"g","name":"Butter (Kuchenteig)"},{"amount":200,"unit":"g","name":"Zucker (Kuchenteig)"},{"amount":4,"unit":"Stück","name":"Eier (Kuchenteig)"},{"amount":250,"unit":"g","name":"Mehl (Kuchenteig)"},{"amount":1,"unit":"TL","name":"Backpulver (Kuchenteig)"},{"amount":1,"unit":"TL","name":"Vanilleextrakt (Kuchenteig)"},{"amount":1,"unit":"Prise","name":"Salz"},{"amount":75,"unit":"g","name":"Butter (Frosting)"},{"amount":125,"unit":"g","name":"Frischkäse (Frosting)"},{"amount":1.5,"unit":"Stück","name":"Vanilleschoten (Mark fürs Frosting)"},{"amount":150,"unit":"g","name":"Puderzucker (Frosting)"},{"amount":150,"unit":"g","name":"weiße Kuvertüre"},{"amount":1,"unit":"TL","name":"Kokosfett (optional)"},{"amount":1.5,"unit":"Stück","name":"Vanilleschoten (Mark für Kuvertüre)"},{"amount":0,"unit":"","name":"Schoko- oder Zuckerstreusel"},{"amount":40,"unit":"Stück","name":"Cake-Pop-Stiele / Holzspieße"}],"steps":["Backofen auf 180 °C vorheizen. Weiche Butter mit Zucker aufschlagen, Eier einzeln einarbeiten und trockene Teigzutaten kurz untermischen.","Teig in einer gefetteten Kastenform 45–50 Minuten backen und danach vollständig auskühlen lassen.","Für das Frosting Butter, Frischkäse, Vanillemark und Puderzucker cremig rühren.","Kuchen fein zerbröseln, mit Frosting vermengen und ungefähr 40 Kugeln von 3–4 cm Durchmesser formen. Eine Stunde kühlen.","Weiße Kuvertüre im Wasserbad schmelzen und mit Vanillemark verfeinern. Bei Bedarf etwas Kokosfett zufügen.","Stiele kurz in Kuvertüre tauchen und in die gekühlten Kugeln stecken. Cake-Pops vollständig glasieren, abtropfen lassen und mit Streuseln verzieren. Kühl lagern."],"sourceStatus":"geprüft","unitLabel":"Cake-Pops","note":"Ergibt laut Quelle ca. 40–45 Stück; hier auf 40 Stück gerechnet. Zusätzlich ungefähr 2 Stunden Kühl-/Ruhezeit einplanen."},{"id":"anders-import-04","title":"Vegetarische Spinat-Gemüse-Lasagne mit Tomatensoße","description":"Ofenlasagne mit Spinat, Gemüse und Tomatensoße.","category":"Vegetarisch","time":80,"portions":3,"emoji":"🥬","color":"#fff0d4","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/2114131340630587/Vegetarische-Spinat-Gemuese-Lasagne-mit-Tomatensosse.html","ingredients":[{"amount":2,"unit":"Stück","name":"große Karotten"},{"amount":7,"unit":"Stück","name":"mittelgroße Champignons"},{"amount":1,"unit":"Stück","name":"große Zwiebel"},{"amount":1,"unit":"EL","name":"Öl"},{"amount":5,"unit":"EL","name":"Milch"},{"amount":600,"unit":"g","name":"Rahmspinat (TK)"},{"amount":100,"unit":"g","name":"Kräuterfrischkäse"},{"amount":1,"unit":"gestr. EL","name":"Gemüsebrühepulver"},{"amount":2,"unit":"Zehen","name":"Knoblauch"},{"amount":0,"unit":"","name":"Salz und Pfeffer"},{" lbraun anschwitzen. Das Fleisch zugeben und rundherum Farbe nehmen lassen.","Tomatenmark und Paprikapulver einrühren, dann direkt so viel Wasser zugeben, dass der Topfinhalt leicht bedeckt ist. Kümmel, Salz und Pfeffer zufügen.","Zugedeckt bei niedriger Hitze rund 4 Stunden sanft schmoren; gelegentlich den Flüssigkeitsstand prüfen und nur vorsichtig Wasser nachgießen.","Anschließend ungefähr 1 Stunde ohne Hitze ziehen lassen. Die Sauce wird durch die lange Garzeit von selbst sämig."],"sourceStatus":"geprüft","unitLabel":"Portionen","note":"Das Geheimnis ist die lange Schmorzeit und die große Zwiebelmenge; möglichst nicht mit Mehl abbinden."},{"id":"anders-import-01","title":"Zwiebelkuchen","description":"Deftiger Zwiebelkuchen für die ganze Familie.","category":"Hauptgerichte","time":65,"portions":6,"emoji":"🧅","color":"#fae5dd","image":"","favorite":false,"source":"https://www.chefkoch.de/rezepte/50051017420725/Zwiebelkuchen.html","ingredients":[{"amount":200,"unit":"g","name":"Magerquark"},{"amount":400,"unit":"g","name":"Mehl"},{"amount":1,"unit":"Stück","name":"Ei für den Teig"},{"amount":1,"unit":"Prise","name":"Salz"},{"amount":8,"unit":"EL","name":"Öl"},{"amount":6,"unit":"EL","name":"Milch"},{"amount":1,"unit":"Pck.","name":"Backpulver"},{"amount":7,"unit":"Stück","name":"Zwiebeln"},{"amount":40,"unit":"g","name":"Margarine"},{"amount":300,"unit":"ml","name":"saure Sahne"},{"amount":300,"unit":"g","name":"Joghurt"},{"amount":300,"unit":"g","name":"Kochschinken"},{"amount":300,"unit":"g","name":"Emmentaler"},{"amount":1,"unit":"EL","name":"Speisestärke"},{"amount":3,"unit":"Stück","name":"Eier für den Belag"},{"amount":0,"unit":"","name":"Salz und Pfeffer"}],"steps":["Quark, Mehl, Ei, Öl, Milch, Backpulver und Salz zu einem weichen Teig verarbeiten und auf einem gefetteten Blech verteilen.","Zwiebeln in Ringe schneiden und in Margarine glasig dünsten. Kochschinken würfeln und Käse reiben.","Sahne, Joghurt, Eier und Stärke verrühren, mit Salz und Pfeffer würzen und mit Zwiebeln, Schinken und Käse auf dem Boden verteilen.","Auf dem Blech verteilen und bei 200 °C Ober-/Unterhitze ungefähr 20–25 Minuten backen."],"sourceStatus":"geprüft","unitLabel":"Portionen"}];

 function parseAmount(s){s=(s||'').replace(',','.').trim();const fract={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3};if(fract[s]!=null)return fract[s];if(/^\d+\s+\d+\/\d+$/.test(s)){let[a,b]=s.split(/\s+/);let[x,y]=b.split('/').map(Number);return Number(a)+x/y}if(/^\d+\/\d+$/.test(s)){let[a,b]=s.split('/').map(Number);return b?a/b:0}return parseFloat(s)||0}

   <div class="photo-tools"><label class="pill-btn secondary small" for="detail-image-input">${ico('camera')} ${img?'Foto austauschen':'Foto hinzufügen'}</label><input type="file" id="detail-image-input" accept="image/*" hidden><span class="photo-hint">Eigenes Gerichtsfoto • auf diesem Gerät gespeichert</span>${img?'<button type="button" class="quiet-link" data-action="remove-photo">Foto entfernen</button>':''}</div>
   ${ratingEditor(r)}
   ${complete?`<div class="servings"><span class="serving-label">${escapeHtml(r.unitLabel||'Portionen')} anpassen ✨<small>Wunschmenge direkt eingeben</small></span><input class="serving-input" type="number" id="serving-input" min="1" max="10000" step="1" inputmode="numeric" value="${detailPortions}" aria-label="Gewünschte Anzahl ${escapeHtml(r.unitLabel||'Portionen')}"></div><div class="subhead">Das brauchst du 🧺</div><ul class="ingredient-list" id="detail-ingredients">${ingredientRows(r)}</ul><div class="export-actions"><button class="pill-btn secondary small" data-action="copy-ingredients">📋 Zutaten kopieren</button><button class="pill-btn small bring-btn" data-action="bring-export">🛒 Zu Bring! übertragen</button></div><div class="export-notice">✨ Bring! erhält deine gerade eingestellte Menge – auch bei eigenen Rezepten wie den Cookies. Dafür wird eine öffentliche Rezeptvorschau ohne Fotos, Notizen oder Kontodaten erzeugt. Bitte die Zutaten in Bring! vor dem Hinzufügen prüfen.</div>`:`<div class="not-yet"><b>🔗 Rezeptlink ist gespeichert</b><p>Die Zutaten und Portionsangaben sind hier noch nicht hinterlegt. Öffne das Original oder ergänze sie selbst. Sobald die Mengen eingetragen sind, wird die Portionsberechnung verfügbar.</p></div>`}
   ${r.steps?.length?`<div class="subhead">So wird’s gemacht 👩‍🍳</div><ol class="steps">${r.steps.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ol>`:''}
   ${r.note?`<div class="small-note">ℹ️ ${escapeHtml(r.note)}</div>`:''}
   ${sourceLink?`<a class="pill-btn small original-cta" href="${escapeHtml(sourceLink)}" target="_blank" rel="noopener noreferrer">${ico('link')} Originalrezept öffnen ↗</a>`:''}
   <div class="detail-actions"><button class="pill-btn secondary small" data-action="rename">✏️ Umbenennen</button><button class="pill-btn small" data-action="edit">${ico('edit')} ${complete?'Rezept bearbeiten':'Zutaten ergänzen'}</button><button class="pill-btn secondary small" data-fav="${escapeHtml(r.id)}">${ico('heart')} ${r.favorite?'Favorit entfernen':'Favorit merken'}</button><button class="pill-btn secondary small" data-action="delete-recipe">${ico('trash')} Löschen</button></div></div>`,true)}
 function ingredientRows(r){const factor=detailPortions/(num(r.portions)||1);return(r.ingredients||[]).map(i=>`<li><input type="checkbox" aria-label="Zutat abhaken"><span><b>${i.amount?qty(i.amount*factor)+' ':''}${escapeHtml(i.unit||'')}</b> ${escapeHtml(i.name||'')}</span></li>`).join('')}
 function updateServings(){const r=recipes.find(x=>x.id===modalId);if(!r)return;const list=document.getElementById('detail-ingredients');if(list)list.innerHTML=ingredientRows(r)}
 function addIngredients(){const r=recipes.find(x=>x.id===modalId);if(!r)return;const f=detailPortions/(num(r.portions)||1);for(let x of r.ingredients||[])shopping.push({id:newId(),name:x.name,amount:`${x.amount?qty(x.amount*f)+' ':''}${x.unit||''}`.trim(),done:false});save();toast('Zutaten zur Einkaufsliste hinzugefügt! 🧺')}
 function recipeIngredientsText(r){const factor=detailPortions/(num(r.portions)||1);return [r.title+' – '+qty(detailPortions)+' '+(r.unitLabel||'Portionen'),'',...(r.ingredients||[]).map(i=>((i.amount?qty(i.amount*factor)+' ':'')+(i.unit?i.unit+' ':'')+(i.name||'')).trim())].join('\n')}
 async function copyRecipeIngredients(){const r=recipes.find(x=>x.id===modalId);if(!r)return;const content=recipeIngredientsText(r);try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(content)}else{const e=document.createElement('textarea');e.value=content;e.style.position='fixed';e.style.opacity='0';document.body.append(e);e.select();if(!document.execCommand('copy'))throw Error('Kopieren nicht erlaubt');e.remove()}toast('Zutaten in der Wunschmenge kopiert! 📋')}catch{toast('Kopieren nicht möglich. Bitte Browser-Berechtigungen prüfen.')}}
 function encodedRecipeLink(payload){const bytes=new TextEncoder().encode(JSON.stringify(payload));let raw='';for(const byte of bytes)raw+=String.fromCharCode(byte);return 'https://sisabhrlstgprgxjdnns.supabase.co/functions/v1/bring-recipe?data='+btoa(raw).replaceAll('+','-').replaceAll('/','_').replace(/=+$/,'')}
 function openBringExport(){const r=recipes.find(x=>x.id===modalId);if(!r||!r.ingredients?.length)return;const factor=detailPortions/(num(r.portions)||1);const items=r.ingredients.map(i=>((i.amount?qty(i.amount*factor)+' ':'')+(i.unit?i.unit+' ':'')+(i.name||'')).trim()).filter(Boolean);const payload={title:String(r.title||'Rezept').slice(0,160),servings:detailPortions,unit:String(r.unitLabel||'Portionen').slice(0,32),ingredients:items};let recipeUrl;try{recipeUrl=encodedRecipeLink(payload)}catch{toast('Der Rezept-Export konnte nicht vorbereitet werden.');return}if(recipeUrl.length>9000){toast('Zu viele Zutaten für den Bring!-Link. Bitte „Zutaten kopieren“ verwenden.');return}const link='https://api.getbring.com/rest/bringrecipes/deeplink?url='+encodeURIComponent(recipeUrl)+'&source=web&baseQuantity='+detailPortions+'&requestedQuantity='+detailPortions;const a=document.createElement('a');a.href=link;a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove();toast('Bring!-Import gestartet. Bitte Zutaten prüfen. 🛒')}
 function compressFile(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onload=()=>{let scale=Math.min(1,900/Math.max(img.width,img.height));let cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*scale));cv.height=Math.max(1,Math.round(img.height*scale));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/jpeg',.72))};img.onerror=reject;img.src=reader.result};reader.readAsDataURL(file)})}
 async function runOCR(){if(!ocrFile)return;const run=document.getElementById('scan-run'),status=document.getElementById('scan-status');run.disabled=true;status.className='status';status.textContent='✨ Texterkennung wird geladen …';try{if(!window.Tesseract){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('Texterkennung konnte nicht geladen werden. Internetverbindung prüfen.'));document.head.append(s)})}const result=await Tesseract.recognize(ocrFile,'deu+eng',{logger:m=>{if(m.status==='recognizing text'&&status)status.textContent=`📖 Foto wird gelesen … ${Math.round((m.progress||0)*100)} %`}});const text=result?.data?.text?.trim();if(!text||text.length<10)throw Error('Auf diesem Foto wurde kaum lesbarer Text gefunden.');const parsed=parseRecipeText(text);if(!parsed.ingredients.length){parsed.ingredients=linesToIngredientsFallback(text)}editForm(parsed);toast('Foto ausgelesen! Bitte Angaben prüfen. ✨')}catch(err){status.className='status warn';status.textContent='⚠️ '+err.message+' Du kannst dein Rezept alternativ unter „Selbst eintragen“ anlegen.';run.disabled=false}}
 function linesToIngredientsFallback(s){return s.split(/\n/).map(x=>x.trim()).filter(x=>/^\d+(?:[,.]\d+)?\s*(g|kg|ml|l|EL|TL|Stück)\b/i.test(x)).map(parseIngredient).filter(Boolean)}
 function writeForm(form){let fd=new FormData(form),title=String(fd.get('title')||'').trim(),ing=String(fd.get('ingredients')||'').split(/\r?\n/).map(parseIngredient).filter(Boolean),steps=String(fd.get('steps')||'').split(/\r?\n/).map(x=>x.trim().replace(/^\d+[.)]\s*/,'' )).filter(Boolean);if(!title||!ing.length||!steps.length){toast('Bitte Name, Zutaten und Schritte ausfüllen.');return}let previous=recipes.find(x=>x.id===formEdit);let r={id:previous?.id||newId(),title,description:String(fd.get('description')||'').trim(),category:String(fd.get('category')||'Abendessen'),time:Math.max(1,num(fd.get('time'))||30),portions:Math.max(1,num(fd.get('portions'))||4),emoji:String(fd.get('emoji')||'🍲'),image:formImage||'',color:previous?.color||'#ffe7dd',favorite:previous?.favorite||false,rating:ratingValue(previous||{}),source:String(fd.get('source')||''),ingredients:ing,steps,unitLabel:previous?.unitLabel||(String(fd.get('category')||'')==='Weihnachtsbäckerei'?'Stück':'Portionen'),sourceStatus:'geprüft'};if(previous)recipes=recipes.map(x=>x.id===r.id?r:x);else recipes.unshift(r);save();closeModal();filter='Alle';query='';page='recipes';draw();toast(previous?'Rezept aktualisiert! 💗':'Dein Rezept ist gespeichert! 💗')}
 function importLinkOnly(raw){
   let u;try{u=new URL(raw)}catch{toast('Bitte einen gültigen Rezeptlink eingeben.');return}
   if(!['http:','https:'].includes(u.protocol)){toast('Nur http- und https-Links sind erlaubt.');return}
   if(recipes.some(r=>r.source===u.href)){toast('Dieses Rezept ist schon im Kochbuch! 💗');return}
   let slug=decodeURIComponent(u.pathname.split('/').filter(Boolean).pop()||'Rezept').replace(/\.html?$/i,'').replace(/[-_]+/g,' ').trim();
   let title=slug.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ').slice(0,120)||'Neues Lieblingsrezept';
   recipes.unshift({id:newId(),title,description:'Rezeptlink zum späteren Ergänzen.',category:'Sonstiges',time:null,portions:null,emoji:'🔗',color:'#fbe7e9',image:'',favorite:false,source:u.href,ingredients:[],steps:[],sourceStatus:'link',unitLabel:'Portionen'});
   save();closeModal();page='recipes';filter='Alle';query='';draw();toast('Rezeptlink gespeichert! 🔗');
 }
 function exportData(){const data={app:'Anders lecker!',version:1,exportedAt:new Date().toISOString(),recipes,shopping};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='anders-lecker-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Backup heruntergeladen! 💾')}
 async function importData(file){try{const o=JSON.parse(await file.text());if(!Array.isArray(o.recipes)||!Array.isArray(o.shopping))throw Error('Ungültige Backup-Datei.');if(!confirm(`Backup mit ${o.recipes.length} Rezepten ergänzen? Deine vorhandenen Rezepte bleiben erhalten.`))return;
 const known=new Set(recipes.map(r=>r.source?'url:'+r.source:'id:'+r.id));let added=0;
 for(let r of o.recipes){let key=r.source?'url:'+r.source:'id:'+r.id;if(!known.has(key)){recipes.push(r);known.add(key);added++}}
 const shopids=new Set(shopping.map(x=>x.id));for(let x of o.shopping)if(!shopids.has(x.id)){shopping.push(x);shopids.add(x.id)}
 save();page='home';filter='Alle';query='';draw();toast(`${added} Rezepte aus Backup ergänzt! 💗`)}catch(err){toast('Import fehlgeschlagen: '+err.message)}}
 document.addEventListener('click',e=>{const btn=e.target.closest('[data-page],[data-action],[data-open],[data-fav],[data-rate],[data-filter],[data-collection],[data-tab],[data-shop-delete]');if(!btn){if(e.target.matches('[data-overlay]'))closeModal();return}if(btn.dataset.rate){const r=recipes.find(x=>x.id===modalId);if(r){const old=r.rating;r.rating=Number(btn.dataset.rate);if(save()){renderDetail(r);draw();toast('Bewertung gespeichert! ⭐')}else r.rating=old;}return}if(btn.dataset.page){page=btn.dataset.page;query='';filter='Alle';closeModal();draw();return}if(btn.dataset.open){showRecipe(btn.dataset.open);return}if(btn.dataset.fav){let r=recipes.find(x=>x.id===btn.dataset.fav);if(r){r.favorite=!r.favorite;save();if(modalId)renderDetail(r);draw();toast(r.favorite?'Im Lieblingsbuch gespeichert 💗':'Aus Favoriten entfernt')}return}if(btn.dataset.filter){filter=btn.dataset.filter;draw();return}if(btn.dataset.collection){page='recipes';filter=btn.dataset.collection;query='';draw();return}if(btn.dataset.tab){setNewTab(btn.dataset.tab);return}if(btn.dataset.shopDelete){shopping=shopping.filter(s=>s.id!==btn.dataset.shopDelete);save();draw();return}
 const a=btn.dataset.action;if(!a)return;if(a==='new')recipeModal('manual');else if(a==='scan')recipeModal('photo');else if(a==='close')closeModal();else if(a==='manual-form')editForm();else if(a==='parse-text'){let t=document.getElementById('pasted-recipe').value,u=document.getElementById('pasted-url').value;if(!t.trim()&&!u.trim()){toast('Bitte Rezepttext oder einen Link eingeben.');return}if(!t.trim()&&u.trim()){importLinkOnly(u.trim());return}const r=parseRecipeText(t);r.source=u;editForm(r)}else if(a==='run-ocr')runOCR();else if(a==='copy-ingredients')copyRecipeIngredients();else if(a==='bring-export')openBringExport();else if(a==='clear-rating'){const r=recipes.find(x=>x.id===modalId);if(r){const old=r.rating;r.rating=0;if(save()){renderDetail(r);draw();toast('Bewertung entfernt. ⭐')}else r.rating=old;}}else if(a==='remove-photo'){const r=recipes.find(x=>x.id===modalId);if(r){const old=r.image;r.image='';if(save()){renderDetail(r);draw();toast('Foto entfernt. 📸')}else r.image=old;}}else if(a==='rename'){const r=recipes.find(x=>x.id===modalId);if(!r)return;const name=prompt('Wie soll das Rezept heißen?',r.title);if(name===null)return;const clean=name.trim();if(!clean||clean.length>120){toast('Bitte einen Namen mit 1 bis 120 Zeichen eingeben.');return}const old=r.title;r.title=clean;if(save()){renderDetail(r);draw();toast('Rezept umbenannt! ✏️')}else r.title=old;}else if(a==='edit'){const r=recipes.find(x=>x.id===modalId);if(r)editForm(r)}else if(a==='delete-recipe'){if(!confirm('Dieses Rezept wirklich löschen?'))return;recipes=recipes.filter(x=>x.id!==modalId);save();closeModal();draw();toast('Rezept gelöscht.')}else if(a==='add-shop'){let input=document.getElementById('shop-new'),v=input?.value?.trim();if(!v)return;shopping.push({id:newId(),name:v,amount:'',done:false});save();draw()}else if(a==='clear-checked'){shopping=shopping.filter(s=>!s.done);save();draw()}else if(a==='export')exportData();else if(a==='reset'){if(!confirm('Alle persönlichen Änderungen zurücksetzen und die 37 hinterlegten Rezepte erneut laden?'))return;recipes=structuredClone(examples);shopping=[];save();page='home';draw();toast('37 Rezepte aus eurer Sammlung neu geladen!')}});
 document.addEventListener('change',async e=>{let t=e.target;if(t.id==='serving-input'){const v=Number(t.value);if(!Number.isInteger(v)||v<1||v>10000){t.value=String(detailPortions);toast('Bitte eine ganze Zahl von 1 bis 10.000 eingeben.')}return}if(t.id==='ocr-image'&&t.files?.[0]){ocrFile=t.files[0];document.getElementById('scan-run').disabled=false;let preview=document.getElementById('scan-preview-wrap');let src=URL.createObjectURL(ocrFile);preview.innerHTML=`<img class="scan-preview" alt="Ausgewähltes Foto" src="${escapeHtml(src)}">`;document.getElementById('scan-status').textContent='📸 Foto ausgewählt. Klicke auf „Rezept auslesen“.'}else if(t.id==='detail-image-input'&&t.files?.[0]){const key=modalId;const r=recipes.find(x=>x.id===key);if(!r)return;try{const img=await compressFile(t.files[0]);const old=r.image;r.image=img;if(save()){if(modalId===key)renderDetail(r);draw();toast('Rezeptfoto gespeichert! 📸')}else{r.image=old;toast('Speicherplatz reicht für das Bild nicht aus. Bitte erst ein Backup erstellen.')}}catch{toast('Foto konnte nicht verarbeitet werden.')}}else if(t.id==='cover-input'&&t.files?.[0]){try{formImage=await compressFile(t.files[0]);toast('Rezeptfoto übernommen. 📸')}catch{toast('Foto konnte nicht verarbeitet werden.')}}else if(t.id==='import-json'&&t.files?.[0])importData(t.files[0]);else if(t.dataset.shopCheck){let s=shopping.find(x=>x.id===t.dataset.shopCheck);if(s){s.done=t.checked;save();t.closest('.shop-row')?.classList.toggle('checked',s.done)}}});
 document.addEventListener('submit',e=>{if(e.target.id==='recipe-form'){e.preventDefault();writeForm(e.target)}});
 document.addEventListener('input',e=>{if(e.target.id==='serving-input'){const value=Number(e.target.value);if(Number.isInteger(value)&&value>=1&&value<=10000){detailPortions=value;updateServings()}return}if(e.target.id==='recipe-search'){query=e.target.value;let grid=document.getElementById('recipes-grid');if(grid)grid.innerHTML=filtered().length?filtered().map(card).join(''):`<div class="empty"><div class="big-emoji">🍽️</div><h3>Leider kein Treffer</h3><p>Versuch einen anderen Suchbegriff.</p></div>`}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='shop-new'){e.preventDefault();document.querySelector('[data-action="add-shop"]')?.click()}});
 if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
 draw();
})();
</script>
